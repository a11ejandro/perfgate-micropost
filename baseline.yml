version: 1

execution:
  samples: 8
  warmup: 2

metrics:
  duration:     { enabled: true }
  sql_count:    { enabled: true }
  sql_duration: { enabled: true }
  allocations:  { enabled: true }
  gc:           { enabled: true }
  memory:       { enabled: false }

comparison:
  noise_ratio_threshold: true
  practical_thresholds:
    duration:
      warning_percent:    5
      failure_percent:    10
      minimum_absolute_ms: 10
    sql_count:
      warning_absolute:  0
      failure_percent:   0
    allocations:
      warning_percent:   10
      failure_percent:   20

policy:
  fail_on:          regression
  missing_baseline: warn
  incompatible:     warn

storage:
  path: .baseline
