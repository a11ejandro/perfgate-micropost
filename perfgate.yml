version: 1

execution:
  samples: 8
  warmup: 2

dataset:
  id: micropost-fixtures
  schema_version: "1"
  generator_version: "1"
  seed: 12345
  scale: "users=10,microposts=100,comments=300"
  cache_state: cold

metrics:
  duration:     { enabled: true }
  sql_count:    { enabled: true }
  sql_duration: { enabled: true }
  allocations:  { enabled: true }
  gc:           { enabled: true }
  memory:       { enabled: false }

comparison:
  max_baseline_age_seconds: 604800
  noise_ratio_threshold: 0.5
  practical_thresholds:
    duration:
      warning_percent:    5
      failure_percent:    10
      minimum_absolute_ms: 10
    sql_count:
      warning_absolute:  0
      failure_percent:   0
    allocations:
      warning_percent:   10
      failure_percent:   20

policy:
  # Keep advisory until repeated A/A and injected-regression runs establish
  # acceptable false-decision rates and power on this CI runner.
  mode:             advisory
  fail_on:          fail
  missing_baseline: warn
  incompatible:     warn

storage:
  path: .perfgate
